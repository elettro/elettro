<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elettro — Selected Works</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <link rel="stylesheet" href="portfolio.css" />
</head>
<body>
  <header class="global-header">
    <nav class="pf-nav" aria-label="Global">

      <!-- Brand -->
      <div class="pf-nav-brand">
        <a href="https://elettro.com/" class="pf-logo-link" aria-label="Elettro home">
          <svg class="pf-logo-bolt" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
          <img src="../images/Elettro-logo-white.png" alt="Elettro" class="pf-logo-img" />
        </a>
      </div>

      <!-- Mobile toggle -->
      <button class="pf-mobile-toggle" id="pf-menu-toggle" type="button" aria-expanded="false" aria-controls="pf-menu-panel" aria-label="Toggle navigation menu">
        <span class="material-symbols-outlined" style="font-size:20px">menu</span>
      </button>

      <!-- Centre pill -->
      <div class="pf-nav-center">
        <a href="https://elettro.com/#contact" class="pf-avail-pill" aria-label="Available for work">
          <span class="pf-avail-dot"></span>
          <span class="pf-avail-text">AVAILABLE FOR WORK</span>
        </a>
      </div>

      <!-- Desktop links -->
      <div class="pf-nav-links" id="pf-nav-links">
        <a class="pf-link" href="https://elettro.com/#services">Services</a>
        <a class="pf-link" href="https://elettro.com/#portfolio">Highlights</a>
        <a class="pf-link pf-link--active" href="/portfolio/" aria-current="page">Portfolio</a>
        <a class="pf-link" href="https://elettro.com/#process">Process</a>
        <a class="pf-link" href="https://elettro.com/#about">About</a>
        <a class="pf-link" href="https://elettro.com/#seo-reports">SEO &amp; AIO Reports</a>
        <a class="pf-link" href="https://elettro.com/#contact">Contact</a>
        <div class="pf-divider" aria-hidden="true"></div>
        <a class="pf-org-pill" href="https://Elettro.org" target="_blank" rel="noopener noreferrer">✦ Elettro.org</a>
        <a class="pf-cta" href="https://elettro.com/#contact">Contact Us</a>
      </div>

      <!-- Mobile menu panel -->
      <div class="pf-mobile-panel" id="pf-menu-panel" hidden>
        <a class="pf-mobile-link" href="https://elettro.com/#services">Services</a>
        <a class="pf-mobile-link" href="https://elettro.com/#portfolio">Highlights</a>
        <a class="pf-mobile-link pf-mobile-link--active" href="/portfolio/" aria-current="page">Portfolio</a>
        <a class="pf-mobile-link" href="https://elettro.com/#process">Process</a>
        <a class="pf-mobile-link" href="https://elettro.com/#about">About</a>
        <a class="pf-mobile-link" href="https://elettro.com/#seo-reports">SEO &amp; AIO Reports</a>
        <a class="pf-mobile-link" href="https://elettro.com/#contact">Contact</a>
        <a class="pf-mobile-cta" href="https://elettro.com/#contact">Start Your Project</a>
        <a class="pf-mobile-link" href="https://Elettro.org" target="_blank" rel="noopener noreferrer">✦ Visit Elettro.org</a>
      </div>

    </nav>
  </header>

  <div id="root"></div>

  <footer class="global-footer">
    <p>© <span id="global-year"></span> Elettro Studio. All rights reserved.</p>
    <a href="https://elettro.com/portfolio">Back to top</a>
  </footer>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="portfolio.jsx"></script>
  <script>
    document.getElementById("global-year").textContent = new Date().getFullYear();
    // Mobile nav
    const pfToggle = document.getElementById('pf-menu-toggle');
    const pfPanel  = document.getElementById('pf-menu-panel');
    if (pfToggle && pfPanel) {
      pfToggle.addEventListener('click', () => {
        const open = pfToggle.getAttribute('aria-expanded') === 'true';
        pfToggle.setAttribute('aria-expanded', String(!open));
        pfPanel.hidden = open;
      });
      pfPanel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
        pfToggle.setAttribute('aria-expanded', 'false');
        pfPanel.hidden = true;
      }));
    }
  </script>
</body>
</html>
