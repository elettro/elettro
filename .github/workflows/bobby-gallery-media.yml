name: Prepare Bobby approval gallery media
on:
  push:
    paths:
      - '.github/workflows/bobby-gallery-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bobby-gallery-media
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and render gallery previews
        run: python3 scripts/bobby-gallery-media.py
      - name: Save preview media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/bobby/media clients/bobby/gallery.json
          git diff --cached --quiet && exit 0
          git commit -m "Add numbered Bobby approval gallery video and audio previews"
          git pull --rebase origin main
          git push origin HEAD:main
