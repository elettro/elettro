<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deep Reef · Elettro Remote</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--u:1vmin;--ink:#eaf6fb;--gold:#e8c987;--glass:rgba(3,22,36,.5);--line:rgba(190,235,255,.22)}

#c{position:fixed;inset:0;width:100%;height:100%;display:block}

html{font-size:calc(var(--u)*1.9)}
#brand{left:1.4rem;top:1.2rem;padding:.55rem 1.1rem;display:flex;align-items:center;gap:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem}
#brand i{width:.55rem;height:.55rem;border-radius:50%;background:#52e0a8;box-shadow:0 0 .7rem #52e0a8}

#mid{left:50%;top:1.2rem;transform:translateX(-50%);width:min(44vw,38rem);text-align:center}
#energy{padding:.55rem 1.1rem .65rem}
#energy .l{display:flex;justify-content:space-between;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#bfe9f7}
#energy .bar{height:.55rem;margin-top:.4rem;border-radius:9rem;background:rgba(255,255,255,.12);overflow:hidden}
#energy .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#27d2c6,#6ee7a8,#f3d37a);border-radius:9rem;transition:width .35s}
#banner{margin-top:.7rem;padding:.55rem 1.3rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;opacity:0;transform:translateY(-.5rem);transition:.35s;display:inline-block}
#banner.on{opacity:1;transform:none}
#banner.red{background:rgba(120,12,12,.62);border-color:rgba(255,120,110,.6)}
#banner.gold{background:rgba(90,64,6,.6);border-color:rgba(255,220,140,.6)}
#clock{right:1.4rem;top:1.2rem;padding:.55rem 1.1rem;font-weight:800;font-size:.9rem;letter-spacing:.1em;font-variant-numeric:tabular-nums}
#board{right:1.4rem;top:4.2rem;width:15.5rem;padding:.8rem 1rem;border-radius:1.1rem;font-size:.72rem}
#board h4{margin:0 0 .5rem;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
#board .r{display:flex;align-items:center;gap:.5rem;padding:.22rem 0;font-weight:700}
#board .r i{width:.55rem;height:.55rem;border-radius:50%;flex:none}
#board .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .r b{font-variant-numeric:tabular-nums}
#board .e{opacity:.6;font-weight:500}
#toasts{left:1.4rem;top:4.4rem;display:flex;flex-direction:column;gap:.45rem;align-items:flex-start}
.toast{padding:.4rem .95rem;font-size:.7rem;font-weight:700;display:flex;gap:.55rem;align-items:center;animation:in .35s both;transition:opacity .6s}
.toast i{width:.6rem;height:.6rem;border-radius:50%}
.toast.out{opacity:0}
@keyframes in{from{opacity:0;transform:translateX(-1rem)}}
#snd{left:1.4rem;bottom:1.3rem;width:2.4rem;height:2.4rem;display:grid;place-items:center;pointer-events:auto;cursor:pointer;padding:0}
body.kiosk #snd,body.kiosk #back{display:none}
#back{left:4.4rem;bottom:1.3rem;padding:.6rem 1rem;font-size:.7rem;font-weight:700;color:#fff;text-decoration:none;pointer-events:auto}
body.framed #back{display:none}
#join{right:1.4rem;bottom:1.3rem;width:11.5rem;padding:.8rem;border-radius:1.2rem;background:#fff;color:#06243a;text-align:center;transition:all .6s cubic-bezier(.2,.8,.2,1);transform-origin:100% 100%}
#join .jt{font-weight:800;font-size:.68rem;letter-spacing:.16em}
#join .jt2{font-size:.55rem;opacity:.6;margin-bottom:.4rem}
#qr{display:block;margin:0 auto;width:100%;aspect-ratio:1}
#qr img,#qr canvas{width:100%!important;height:auto!important;display:block}
#join .jc{margin-top:.4rem;font-weight:800;letter-spacing:.3em;font-size:1.1rem}
#join .jc span{font-size:.5rem;letter-spacing:.14em;display:block;opacity:.55}
#join .ju{font-size:.46rem;opacity:.5;margin-top:.2rem}
#join.big{right:50%;bottom:50%;transform:translate(50%,50%) scale(1.9);box-shadow:0 2rem 6rem rgba(0,0,0,.5)}

#steps small{display:block;opacity:.55;font-weight:500;font-size:.55rem;margin-left:1.65rem}
#note{left:50%;top:9rem;transform:translateX(-50%);padding:.5rem 1rem;font-size:.7rem;display:none}
#res{inset:0;display:none;place-items:center;background:rgba(1,12,22,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:8}
#res.on{display:grid}
#res .card{width:min(64vw,52rem);text-align:center}
#res h2{margin:0;font-size:2rem;letter-spacing:.06em}
#res .sub{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-weight:800;margin-bottom:1.2rem}

#res .pc b{display:block;font-size:1.1rem}
#res .pc canvas{width:100%;height:4rem;display:block;margin-bottom:.4rem}
#res .pc .n{font-size:1.9rem;font-weight:800;color:var(--gold)}
#res .pc .s{font-variant-numeric:tabular-nums;opacity:.85;font-weight:700}
#res .best{font-size:.8rem;opacity:.85}
#res .next{margin-top:1rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
#vig{inset:0;z-index:4;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,10,22,.55));opacity:1}
#alert{inset:0;z-index:4;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(200,20,20,.5));opacity:0;transition:opacity .6s}
#alert.on{opacity:1;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.45}}
</style>
</head>

<div id="toasts" class="hud"></div>

<a id="back" class="hud pill" href="/remote/">&larr; Back</a>
<div id="steps" class="hud pill"><div><em>1</em>Scan the code<small>Escanea el código</small></div><div><em>2</em>Pick your fish<small>Elige tu pez</small></div><div><em>3</em>Eat. Grow. Survive.<small>Come. Crece. Sobrevive.</small></div></div>
<div id="join" class="hud big"><div class="jt">SCAN TO DIVE IN</div><div class="jt2">Escanea para entrar</div><div id="qr"></div><div class="jc"><span>CODE</span><b id="code">····</b></div><div class="ju" id="jurl"></div></div>
<div id="note" class="hud pill"></div>
<div id="res" class="hud"><div class="card"><div class="sub">Round complete</div><h2 id="resT">Reef champion</h2><div class="pod" id="pod"></div><div class="best" id="best"></div><div class="next" id="next"></div></div></div>

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fg, 0, 0); ctx.setTransform(S, 0, 0, S, 0, 0);
  /* blue depth haze */
  var hz = ctx.createLinearGradient(0, 0, 0, H); hz.addColorStop(0, 'rgba(0,60,100,0)'); hz.addColorStop(1, 'rgba(0,20,50,.3)'); ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H);
}
var lastBoard = 0, lastHud = 0;
function hud(now) {
  if (now - lastHud < 150) return; lastHud = now;
  var m = Math.max(0, phase === 'play' ? roundT : resT), mm = Math.floor(m / 60), ss = Math.floor(m % 60); $('roundT').textContent = (phase === 'play' ? '' : 'Next round ') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  var gl2 = goal + 35 * count(), ep = clamp(energy / gl2 * 100, 0, 100); $('enFill').style.width = ep + '%'; $('enN').textContent = Math.round(ep) + '%';
  var arr = sorted().slice(0, 5), h = '', i; for (i = 0; i < 5; i++) { var p = arr[i]; h += p ? '<div class="r"><i style="background:' + p.color + '"></i><span></span><b>' + Math.round(p.score).toLocaleString() + '</b></div>' : '<div class="r e"><i style="background:#456"></i><span>—</span><b></b></div>'; }
  $('rows').innerHTML = h; var sp = $('rows').querySelectorAll('span'); for (i = 0; i < arr.length; i++) sp[i].textContent = (i + 1) + '. ' + arr[i].name;
  var n = count(); $('join').classList.toggle('big', n === 0); $('steps').style.display = n === 0 ? 'none' : 'flex'; $('board').style.display = n === 0 ? 'none' : 'block'; $('brand').style.opacity = n === 0 ? .9 : 1;
  podAv.forEach(function (a) { ReefArt.avatar(a[0], a[1], clock, { sp: .35 }); });
}

/* ---------------- sound ---------------- */
var Snd = (function () {
  var ac = null, on = false, master = null;
  function init() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
    var buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0), last = 0; for (var i = 0; i < d.length; i++) { last = (last + (Math.random() * 2 - 1) * .02) * .995; d[i] = last * 6; }
    var src = ac.createBufferSource(); src.buffer = buf; src.loop = true; var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380; var g = ac.createGain(); g.gain.value = .22; src.connect(f); f.connect(g); g.connect(master); src.start(); } catch (e) { ac = null; } }
  function tone(fr, d, type, v, sl) { if (!on || !ac) return; var o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = fr; if (sl) o.frequency.exponentialRampToValueAtTime(sl, ac.currentTime + d); g.gain.setValueAtTime(v || .15, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d); o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + d + .02); }
  return { get on() { return on; }, set: function (v) { on = v; if (v) { init(); if (ac && ac.state === 'suspended') ac.resume(); } if (master) master.gain.value = v ? .5 : 0; },
    eat: function (c) { tone(520 + Math.min(c, 14) * 38, .09, 'sine', .08); }, chime: function () { tone(660, .4, 'triangle', .12); setTimeout(function () { tone(990, .5, 'triangle', .1); }, 110); },
    whoosh: function () { tone(300, .3, 'sawtooth', .05, 90); }, power: function () { tone(220, .5, 'square', .06, 660); }, ping: function () { tone(1100, .9, 'sine', .1, 700); },
    gulp: function () { tone(120, .25, 'sine', .2, 60); }, alarm: function () { tone(180, .5, 'sawtooth', .1, 140); setTimeout(function () { tone(180, .5, 'sawtooth', .1, 140); }, 600); } };
})();
function setSound(v) { Snd.set(v); $('sW').style.display = v ? '' : 'none'; $('sX').style.display = v ? 'none' : ''; }
$('snd').addEventListener('click', function () { setSound(!Snd.on); }); setSound(false);
if (Q.has('sound')) setSound(true);

/* ---------------- room / net ---------------- */
var room = ReefNet.clean(Q.get('room')), explicit = !!room, qrFor = '';
if (!room) { try { room = ReefNet.clean(sessionStorage.getItem('reef2Room')); } catch (e) {} } if (!room) room = ReefNet.randomCode();
function joinURL(cd) { return new URL('play.html?room=' + cd, location.href).href; }
function renderJoin() {
  $('code').textContent = room; try { sessionStorage.setItem('reef2Room', room); } catch (e) {}
  var url = joinURL(room); $('jurl').textContent = url.replace(/^https?:\/\//, '').replace(/\?.*$/, ''); if (qrFor === room) return; qrFor = room; $('qr').innerHTML = '';
  try { new QRCode($('qr'), { text: url, width: 512, height: 512, colorDark: '#06243a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $('qr').textContent = room; }
}
function showNote(m) { var n = $('note'); n.textContent = m; n.style.display = m ? 'block' : 'none'; }
function startNet() {
  if (!window.Peer) { showNote('Offline — phones can’t join right now (press B for demo swimmers)'); return; }
  net = ReefNet.host(room, { open: function (cd) { room = cd; renderJoin(); showNote(''); }, taken: function (cd) { if (explicit) { showNote('Room ' + cd + ' is busy — retrying…'); setTimeout(function () { net.restart(cd); }, 3500); } else { room = ReefNet.randomCode(); renderJoin(); net.restart(room); } },
    error: function (e) { if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error')) showNote('Reconnecting to the phone link…'); }, join: function () {}, msg: onMsg, leave: onLeave });
  setInterval(function () { if (net) net.broadcast({ t: 'hb' }); }, 2000);
}
var botN = 0; function addBot() { if (count() >= MAXP) return; var id = 'bot' + (++botN), p = newPlayer(id, id, null, pick(PLAY), true); p.name = p.name + ' (demo)'; }
function clearBots() { for (var u in players) if (players[u].bot) removePlayer(players[u], 'bye'); }
var DEMO = +Q.get('bots') || 0;
addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'b') addBot(); else if (k === 'B') clearBots(); else if (k === 'p') startManta(); else if (k === 'h') event('shark'); else if (k === 'k') event('krill'); else if (k === 'l') event('bloom'); else if (k === 'r') { roundT = 1; }
  else if (k === 'f') { var el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen()); } else if (k === 's') setSound(!Snd.on);
  else if (k === 'Escape' && FRAMED) { try { parent.postMessage({ type: 'reef-exit' }, location.origin); } catch (x) {} }
});

/* ---------------- main loop ---------------- */
var last = performance.now(), fixed = Q.has('paused');
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000); last = now; tNow = now / 1000;
  if (!fixed) update(dt); drawBack(clock); drawFront(clock); hud(now); requestAnimationFrame(frame);
}
resize(); initWorld(); renderJoin(); startNet(); ReefArt.PLAY.forEach(function (id) { ReefArt.frames(id, 300); }); ['barra', 'shark', 'manta', 'anth'].forEach(function (id) { ReefArt.frames(id, RES[id]); });
requestAnimationFrame(frame);
window.__reef2 = { players: players, preds: preds, plank: plank, npcs: npcs, act: act, addBot: addBot, event: event, state: function () { return { phase: phase, roundT: roundT, energy: energy, goal: goal + 35 * count(), n: count(), plank: plank.length, preds: preds.map(function (d) { return d.sp + ':' + d.state; }) }; }, setT: function (t) { roundT = t; } };
})();
</script>
