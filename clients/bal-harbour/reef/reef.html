<style>
  :root{--navy:#06245a;--aqua:#18e0ff;--sun:#ffd23f;--pink:#ff5fc0}
  *{box-sizing:border-box}
  html{font-size:max(12px,1.7vmin)}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a5fb0;color:#fff;
    font-family:Fredoka,"Arial Rounded MT Bold",ui-rounded,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body.kiosk{cursor:none}
  #reef{position:fixed;inset:0;width:100%;height:100%;display:block}
  .pill{background:rgba(5,40,115,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border:.14rem solid rgba(255,255,255,.38);border-radius:99rem;padding:.45rem 1.1rem;
    box-shadow:0 .4rem 1.6rem rgba(0,20,80,.28);text-shadow:0 .1rem .3rem rgba(0,20,80,.45)}
  .hud{position:fixed;z-index:5}
  #brand{left:1.4rem;top:1.2rem;display:flex;align-items:center;gap:.7rem;padding:.45rem 1.4rem .45rem .7rem}
  #brand svg{width:2.6rem;height:2.6rem;flex:none}
  #brand b{display:block;font-size:1.55rem;line-height:1;letter-spacing:.02em;font-weight:700}
  #brand small{display:block;font-size:.8rem;opacity:.85;letter-spacing:.14em;text-transform:uppercase;margin-top:.2rem}
  #magic{left:50%;top:1.2rem;transform:translateX(-50%);width:min(34rem,38vw);text-align:center}
  #magic .lbl{font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;text-shadow:0 .1rem .4rem rgba(0,20,80,.6)}
  #magic .bar{position:relative;height:1.7rem;margin-top:.3rem;border-radius:99rem;background:rgba(5,40,115,.5);border:.16rem solid rgba(255,255,255,.55);overflow:hidden;box-shadow:0 .4rem 1.4rem rgba(0,20,80,.3)}
  #magic .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99rem;transition:width .6s cubic-bezier(.2,.9,.2,1);
    background:linear-gradient(90deg,#ff5fc0,#ffd23f,#3ddc84,#18e0ff,#8a6bff,#ff5fc0);background-size:200% 100%;animation:slide 3s linear infinite}
  #magic.hot .bar{animation:throb .5s ease-in-out infinite alternate}
  @keyframes slide{to{background-position:-200% 0}}
  @keyframes throb{to{transform:scale(1.04)}}
  #count{right:1.4rem;top:1.2rem;display:flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:600}
  #count svg{width:1.8rem;height:1.8rem}
  #count b{font-size:1.6rem}
  #snd{right:1.4rem;top:4.9rem;width:3rem;height:3rem;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff;font:inherit}
  #snd svg{width:1.5rem;height:1.5rem}
  body.kiosk #snd{opacity:.35}
  #back{left:1.4rem;bottom:1.2rem;color:#fff;text-decoration:none;font-weight:600;font-size:1.05rem;display:none}
  body:not(.kiosk):not(.framed) #back{display:block}
  #toasts{left:1.4rem;top:5.6rem;display:flex;flex-direction:column;gap:.55rem;align-items:flex-start;pointer-events:none}
  .toast{display:flex;align-items:center;gap:.6rem;font-size:1.3rem;font-weight:600;animation:tin .5s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .6s,transform .6s}
  .toast i{width:1.1rem;height:1.1rem;border-radius:50%;box-shadow:0 0 0 .2rem rgba(255,255,255,.7)}
  .toast.out{opacity:0;transform:translateX(-1rem)}
  @keyframes tin{from{opacity:0;transform:translateX(-2rem) scale(.8)}}
  #join{right:1.6rem;bottom:1.6rem;width:15rem;transform-origin:50% 50%;background:#fff;color:var(--navy);text-shadow:none;
    border-radius:1.6rem;padding:.9rem .9rem .8rem;text-align:center;border:.35rem solid var(--sun);
    box-shadow:0 .8rem 3rem rgba(0,20,80,.45);transition:right .9s cubic-bezier(.2,.9,.2,1),bottom .9s cubic-bezier(.2,.9,.2,1),transform .9s cubic-bezier(.2,.9,.2,1)}
  #join.big{right:50%;bottom:50%;transform:translate(50%,50%) scale(1.85);animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{margin-bottom:.9rem}}
  #join .jt{font-weight:700;font-size:1.5rem;letter-spacing:.02em;line-height:1;color:#ff3d96}
  #join .jt2{font-size:.82rem;font-weight:500;opacity:.7;margin:.15rem 0 .5rem}
  #qr{width:100%;aspect-ratio:1;background:#fff;border-radius:.6rem;overflow:hidden;display:grid;place-items:center;position:relative}
  #qr *{width:100%!important;height:auto!important}
  #qr:empty::after{content:"…";font-size:2rem;opacity:.4}
  #join .jc{margin-top:.55rem;display:flex;align-items:baseline;justify-content:center;gap:.5rem}
  #join .jc span{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:600;opacity:.65}
  #join .jc b{font-size:1.9rem;letter-spacing:.2em;font-weight:700;color:#0a5fb0;margin-right:-.2em}
  #join .ju{font-size:.62rem;font-weight:500;opacity:.55;margin-top:.1rem;word-break:break-all}
  #steps{left:1.4rem;bottom:1.4rem;display:flex;gap:.8rem;transition:opacity .6s,transform .6s}
  #steps.off{opacity:0;transform:translateY(2rem);pointer-events:none}
  #steps div{display:flex;align-items:center;gap:.7rem;font-size:1.2rem;font-weight:600;line-height:1.05}
  #steps em{font-style:normal;display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:linear-gradient(135deg,#ffd23f,#ff8a1f);color:var(--navy);font-weight:700;font-size:1.3rem;text-shadow:none;flex:none}
  #steps small{display:block;font-size:.72rem;font-weight:400;opacity:.8}
  #party{left:50%;top:42%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;text-align:center;z-index:6;transition:opacity .4s,transform .8s cubic-bezier(.2,1.5,.4,1)}
  #party.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #party b{display:block;font-size:7.4rem;line-height:.95;font-weight:700;letter-spacing:.02em;
    background:linear-gradient(90deg,#ff5fc0,#ffd23f,#3ddc84,#18e0ff,#8a6bff,#ff5fc0);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:.28rem #fff;paint-order:stroke fill;filter:drop-shadow(0 .5rem 1.5rem rgba(0,20,90,.5));animation:slide 2s linear infinite}
  #party small{display:block;font-size:2.2rem;font-weight:600;margin-top:.8rem;text-shadow:0 .2rem .8rem rgba(0,20,90,.6)}
  #note{left:50%;bottom:1.4rem;transform:translateX(-50%);font-size:1.1rem;font-weight:600;display:none}
</style>

<script>
(function () {
'use strict';
/* ====================================================================
   Bal Harbour Reef — big-screen host.  Everything is drawn in "world units":
   the short side of the screen is 1000 units, whatever the display is.
   ==================================================================== */
var Q = new URLSearchParams(location.search);
var KIOSK = Q.has('kiosk'), DEMO = Q.has('demo');
var FRAMED = false; try { FRAMED = window.parent !== window; } catch (e) { FRAMED = true; }
if (KIOSK) document.body.classList.add('kiosk');

var TAU = Math.PI * 2, PI = Math.PI, sin = Math.sin, cos = Math.cos, abs = Math.abs, min = Math.min, max = Math.max;
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function mulberry(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(h, a) { var n = parseInt(h.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255, t = a < 0 ? 0 : 255, p = abs(a); return 'rgb(' + Math.round((t - r) * p + r) + ',' + Math.round((t - g) * p + g) + ',' + Math.round((t - b) * p + b) + ')'; }
function $(id) { return document.getElementById(id); }

var BY = ReefArt.by, TYPES = ReefArt.types;
var COLORS = ['#ff5a5f', '#ff9f1c', '#ffd23f', '#3ddc84', '#18c7c7', '#3b9bff', '#8a6bff', '#ff5fc0', '#ff7a45', '#a0e426', '#00cfff', '#e56bff'];
var NAMES = ['Coral', 'Splash', 'Bubbles', 'Pearl', 'Sunny', 'Waves', 'Sandy', 'Zippy', 'Mango', 'Pip', 'Dot', 'Kiki', 'Lulu', 'Momo', 'Fizz', 'Gigi', 'Tali', 'Bo', 'Nia', 'Rio'];
var MAXP = 12, GRACE = 30000, MAGIC_MAX = 10, PARTY_LEN = 12;

/* ---------------- canvas / world ---------------- */
var cv = $('reef'), ctx = cv.getContext('2d');
var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
var W = 1778, H = 1000, S = 1, clock = 0;

function sandY(x) { return H * 0.885 + sin(x * 0.0042) * 11 + sin(x * 0.0113 + 1) * 6; }

function resize() {
  var cw = innerWidth || 1280, ch = innerHeight || 720, asp = cw / ch, oW = W, oH = H;
  var ph = min(1440, Math.round(ch * min(devicePixelRatio || 1, 2)));
  cv.height = ph; cv.width = Math.round(ph * asp);
  if (asp >= 1) { H = 1000; W = 1000 * asp; } else { W = 1000; H = 1000 / asp; }
  S = cv.height / H;
  var kx = W / oW, ky = H / oH;
  if (creatures.length) {
    creatures.forEach(function (c) { c.x *= kx; c.y *= ky; c.ai.tx *= kx; c.ai.ty *= ky; });
    pearls.forEach(function (p) { p.x *= kx; p.y *= ky; });
    bubbles.forEach(function (b) { b.x *= kx; b.y *= ky; });
    schools.forEach(function (s) { s.lx *= kx; s.ly *= ky; s.fish.forEach(function (f) { f.x *= kx; f.y *= ky; }); });
    if (whale) { whale.x *= kx; whale.y *= ky; }
  }
  buildBG(); buildKelp(); initDust();
}

/* ---------------- static scenery (drawn once per resize) ---------------- */
function branch(c, x, y, ang, len, w, depth, col, rr, extra) {
  var x2 = x + cos(ang) * len, y2 = y + sin(ang) * len;
  c.strokeStyle = col; c.lineWidth = w + extra; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke();
  if (depth > 0) { var k = 2 + (rr() < 0.45 ? 1 : 0); for (var i = 0; i < k; i++) branch(c, x2, y2, ang + (i - (k - 1) / 2) * 0.72 + (rr() - 0.5) * 0.3, len * 0.74, w * 0.76, depth - 1, col, rr, extra); }
}
function coralStag(c, x, y, h, col, seed) {
  var sd = seed;
  c.save(); c.translate(x, y);
  for (var pass = 0; pass < 2; pass++) {
    var rr = mulberry(sd), n = 3;
    for (var i = 0; i < n; i++) branch(c, (i - 1) * h * 0.18, 0, -PI / 2 + (i - 1) * 0.5 + (rr() - 0.5) * 0.2, h * 0.34, h * 0.075, 3, pass ? col : 'rgba(40,10,90,.38)', rr, pass ? 0 : 5);
  }
  c.restore();
}
function coralBrain(c, x, y, r, col) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.moveTo(-r, 0); c.bezierCurveTo(-r, -r * 1.25, r, -r * 1.25, r, 0); c.closePath();
  var g = c.createRadialGradient(-r * 0.3, -r * 0.7, r * 0.1, 0, -r * 0.3, r * 1.3); g.addColorStop(0, shade(col, 0.45)); g.addColorStop(1, shade(col, -0.12));
  c.fillStyle = g; c.fill(); c.lineWidth = 5; c.strokeStyle = 'rgba(40,10,90,.35)'; c.stroke();
  c.save(); c.clip(); c.strokeStyle = shade(col, 0.5); c.lineWidth = r * 0.07; c.lineCap = 'round';
  for (var k = 0; k < 9; k++) { c.beginPath(); var yy = -r * 0.15 - k * r * 0.12; c.moveTo(-r, yy); for (var xx = -r; xx <= r; xx += r * 0.2) c.lineTo(xx, yy + sin(xx * 0.09 + k * 1.7) * r * 0.06); c.stroke(); }
  c.restore(); c.restore();
}
function coralFan(c, x, y, r, col) {
  c.save(); c.translate(x, y);
  c.strokeStyle = 'rgba(40,10,90,.35)'; c.lineWidth = r * 0.16; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 0.35); c.stroke();
  c.strokeStyle = shade(col, -0.15); c.lineWidth = r * 0.1; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r * 0.35); c.stroke();
  c.translate(0, -r * 0.3);
  c.beginPath(); for (var a = -1.15; a <= 1.15; a += 0.07) { var rr = r * (0.92 + 0.08 * sin(a * 9)); c.lineTo(sin(a) * rr, -cos(a) * rr); } c.lineTo(0, 0); c.closePath();
  var g = c.createRadialGradient(0, 0, r * 0.1, 0, -r * 0.3, r); g.addColorStop(0, shade(col, 0.35)); g.addColorStop(1, col); c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = 'rgba(40,10,90,.35)'; c.stroke();
  c.strokeStyle = shade(col, 0.55); c.lineWidth = 2.4; for (var v = -1.1; v <= 1.1; v += 0.2) { c.beginPath(); c.moveTo(0, 0); c.lineTo(sin(v) * r * 0.92, -cos(v) * r * 0.92); c.stroke(); }
  for (var q = 0.35; q < 0.95; q += 0.2) { c.beginPath(); c.arc(0, 0, r * q, -PI / 2 - 1.1, -PI / 2 + 1.1); c.stroke(); }
  c.restore();
}
function coralTubes(c, x, y, n, col, seed) {
  var rr = mulberry(seed); c.save(); c.translate(x, y);
  for (var i = 0; i < n; i++) {
    var tx = (i - (n - 1) / 2) * 30 + (rr() - 0.5) * 8, th = 60 + rr() * 90, tw = 26 + rr() * 8;
    c.beginPath(); c.moveTo(tx - tw / 2, 4); c.lineTo(tx - tw / 2 + 2, -th); c.ellipse(tx, -th, tw / 2 - 2, tw / 5, 0, PI, 0, true); c.lineTo(tx + tw / 2, 4); c.closePath();
    var g = c.createLinearGradient(tx - tw / 2, 0, tx + tw / 2, 0); g.addColorStop(0, shade(col, 0.3)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -0.25));
    c.fillStyle = g; c.fill(); c.lineWidth = 4; c.strokeStyle = 'rgba(40,10,90,.35)'; c.stroke();
    c.beginPath(); c.ellipse(tx, -th, tw / 2 - 3, tw / 5, 0, 0, TAU); c.fillStyle = '#3a0f5a'; c.fill();
  }
  c.restore();
}

function buildBG() {
  bg.width = cv.width; bg.height = cv.height;
  var c = bgx, rr = mulberry(11), i, x;
  c.setTransform(S, 0, 0, S, 0, 0);
  var g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8af7ff'); g.addColorStop(0.12, '#3fd8f2'); g.addColorStop(0.34, '#12a8e6'); g.addColorStop(0.62, '#0c6fd0'); g.addColorStop(0.86, '#1442ac'); g.addColorStop(1, '#1d2d94');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // distant hills
  [[0.62, 'rgba(120,225,255,.22)', 0.006, 0.07], [0.74, 'rgba(10,70,175,.38)', 0.0047, 0.06]].forEach(function (L, li) {
    c.fillStyle = L[1]; c.beginPath(); c.moveTo(0, H);
    for (x = 0; x <= W + 40; x += 40) c.lineTo(x, H * L[0] + sin(x * L[2] + li * 2) * H * L[3] + sin(x * 0.015 + li) * H * 0.02);
    c.lineTo(W, H); c.closePath(); c.fill();
  });
  // distant coral spires
  for (i = 0; i < 16; i++) {
    var sx = rr() * W, sh = H * (0.12 + rr() * 0.2), sw = 26 + rr() * 40, sy = sandY(sx) + 4;
    c.fillStyle = i % 2 ? 'rgba(255,110,190,.2)' : 'rgba(120,255,210,.16)';
    c.beginPath(); c.moveTo(sx - sw, sy); c.quadraticCurveTo(sx - sw * 0.7, sy - sh, sx, sy - sh); c.quadraticCurveTo(sx + sw * 0.7, sy - sh, sx + sw, sy); c.closePath(); c.fill();
  }
  // sand
  c.beginPath(); c.moveTo(0, H);
  for (x = 0; x <= W + 20; x += 20) c.lineTo(x, sandY(x));
  c.lineTo(W, H); c.closePath();
  var sg = c.createLinearGradient(0, H * 0.86, 0, H); sg.addColorStop(0, '#ffeaa6'); sg.addColorStop(0.45, '#f7c46d'); sg.addColorStop(1, '#e19a4b'); c.fillStyle = sg; c.fill();
  c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,.55)'; c.beginPath(); for (x = 0; x <= W + 20; x += 20) c.lineTo(x, sandY(x)); c.stroke();
  c.strokeStyle = 'rgba(190,120,50,.22)'; c.lineWidth = 3;
  for (i = 0; i < 9; i++) { var ry = H * (0.92 + i * 0.011), ro = rr() * 200; c.beginPath(); for (x = -20; x <= W + 20; x += 24) c.lineTo(x, ry + sin((x + ro) * 0.012 + i) * 4); c.stroke(); }
  // coral garden
  var pal = ['#ff5fa8', '#ff8a3d', '#ffd23f', '#b86bff', '#35e0a1', '#ff6b6b', '#4dd0ff', '#ff9ad5'];
  var kinds = ['stag', 'brain', 'fan', 'tubes', 'brain', 'stag', 'fan', 'tubes'];
  var cx0 = -20, ki = 0;
  while (cx0 < W + 60) {
    var edge = min(cx0, W - cx0), big = edge < W * 0.14 ? 1.45 : 1, kind = kinds[ki % kinds.length], col = pal[(ki * 3 + 1) % pal.length], by = sandY(cx0) + 10;
    if (kind === 'stag') coralStag(c, cx0, by, (170 + rr() * 80) * big, col, 100 + ki);
    else if (kind === 'brain') coralBrain(c, cx0, by, (62 + rr() * 30) * big, col);
    else if (kind === 'fan') coralFan(c, cx0, by, (95 + rr() * 40) * big, col);
    else coralTubes(c, cx0, by, 4 + (ki % 3), col, 200 + ki);
    cx0 += 120 + rr() * 110; ki++;
  }
  // sand decorations
  for (i = 0; i < 26; i++) {
    var dx = rr() * W, dy = sandY(dx) + H * (0.03 + rr() * 0.07), t = rr();
    if (t < 0.32) { // starfish
      var sc = 16 + rr() * 16, sc2 = ['#ff7a45', '#ff5fa8', '#ffb347'][i % 3]; c.save(); c.translate(dx, dy); c.rotate(rr() * TAU);

  drawRays(ctx, t); drawDust(ctx, dt); drawKelp(ctx, t, false); drawAnems(ctx, t); drawChest.call(null, ctx, t);
  if (crab) { ctx.save(); ctx.translate(crab.x, sandY(crab.x) + H * 0.065 + abs(sin(crab.t * 8)) * (crab.pause > 0 ? 0 : 2)); ctx.scale(crab.dir * 0.95, 0.95); ReefArt.draw(ctx, 'crab', crab.t * (crab.pause > 0 ? 0.3 : 1)); ctx.restore(); }
  if (whale) { ctx.save(); ctx.translate(whale.x, whale.y + sin(whale.t * 0.8) * 14); ctx.scale(whale.dir * whale.sc, whale.sc); ctx.globalAlpha = 0.97; ReefArt.draw(ctx, 'whale', whale.t); ctx.restore(); }
  drawSchools(ctx, t);
  for (i = 0; i < pearls.length; i++) drawPearl(ctx, pearls[i], t);
  for (i = 0; i < creatures.length; i++) if (!creatures[i].player) drawCreature(ctx, creatures[i], t);
  for (i = 0; i < creatures.length; i++) if (creatures[i].player) drawCreature(ctx, creatures[i], t);
  for (i = 0; i < bubbles.length; i++) drawBubble(ctx, bubbles[i]);
  drawParts(ctx, t); drawKelp(ctx, t, true); drawParty(ctx, t); drawSurface(ctx, t);
  for (i = 0; i < creatures.length; i++) drawTag(ctx, creatures[i], t);
  if (partyT > PARTY_LEN - 0.4) { ctx.fillStyle = 'rgba(255,255,255,' + (partyT - (PARTY_LEN - 0.4)) / 0.4 * 0.6 + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ---------------- QR / room ---------------- */
var room = ReefNet.clean(Q.get('room')), explicit = !!room, qrFor = '';
if (!room) { try { room = ReefNet.clean(sessionStorage.getItem('reefRoom')); } catch (e) {} }
if (!room) room = ReefNet.randomCode();
function joinURL(cd) { return new URL('play.html?room=' + cd, location.href).href; }
function renderJoin() {
  $('code').textContent = room; try { sessionStorage.setItem('reefRoom', room); } catch (e) {}
  if (FRAMED) try { parent.postMessage({ type: 'reef-room', room: room }, location.origin); } catch (e) {}
  var url = joinURL(room); $('jurl').textContent = url.replace(/^https?:\/\//, '').replace(/\?.*$/, '');
  if (qrFor === room) return; qrFor = room; $('qr').innerHTML = '';
  try { new QRCode($('qr'), { text: url, width: 512, height: 512, colorDark: '#06245a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { $('qr').textContent = room; $('qr').style.fontSize = '3rem'; }
}
function showNote(msg) { var n = $('note'); n.textContent = msg; n.style.display = msg ? 'block' : 'none'; }

function startNet() {
  if (!window.Peer) { showNote('Offline — phones can’t join right now (demo swimmers still work: press B)'); return; }
  net = ReefNet.host(room, {
    open: function (cd) { room = cd; renderJoin(); showNote(''); },
    taken: function (cd) { if (explicit) { showNote('Room ' + cd + ' is busy — retrying…'); setTimeout(function () { net.restart(cd); }, 3500); } else { room = ReefNet.randomCode(); renderJoin(); net.restart(room); } },
    error: function (e) { if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error')) showNote('Reconnecting to the phone link…'); },
    join: function () {}, msg: onMsg, leave: onLeave
  });
  setInterval(function () { if (net) net.broadcast({ t: 'hb' }); }, 2000);
}

/* ---------------- keys: handy for demos ---------------- */
addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'Escape' && FRAMED) { try { parent.postMessage({ type: 'reef-exit' }, location.origin); } catch (x) {} }
  else if (k === 'b') addBot(); else if (k === 'B') clearBots();
  else if (k === 'p') { if (partyT <= 0) startParty(); }
  else if (k === 'f') { var el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : (el.requestFullscreen && el.requestFullscreen())); }
  else if (k === 's') { setSound(!Snd.on); }
  else if (k === 'w') { if (!whale) spawnWhale(); }
});

/* ---------------- boot ---------------- */
initSchools(); resize(); renderJoin(); startNet();
for (var bi = 0, bn = Math.min(6, +Q.get('bots') || 0); bi < bn; bi++) addBot();
addEventListener('resize', resize);
var last = performance.now();
function frame(ts) {
  var dt = min(0.05, (ts - last) / 1000); last = ts; clock += dt;
  update(dt); render(dt); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__reef = { players: players, creatures: creatures, pearls: pearls, bubbles: bubbles, addBot: addBot, party: startParty, state: function () { return { room: room, magic: magic, partyT: partyT, W: W, H: H, n: count() }; } };
})();
</script>
