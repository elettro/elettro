<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix BioPharma — SEO &amp; AIO Audit | Elettro</title>
<style>html,body{margin:0;min-height:100%;background:#081120;color:#f4f8fb;font-family:"Segoe UI",Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.loading a{color:#69b7ff}</style>
</head>
<body>
<div class="loading" id="loading"><div><strong>Loading Helix BioPharma Website Audit…</strong><p><a href="./showcase.html">Open the Creative Showcase</a></p></div></div>
<script>
(async function(){
  const source='https://raw.githubusercontent.com/elettro/elettro/7f32cf121a80c59d405b8943ba15918e9309b5e4/clients/helix/index.html';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('Audit source unavailable');
    let html=await response.text();
    const showcase=`<div style="margin:28px 0 0"><a href="./showcase.html" style="display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;border:1px solid rgba(95,168,234,.5);background:rgba(46,134,216,.12);color:#f4f8fb;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.2px">View Creative, Infographic &amp; Podcast Showcase →</a></div>`;
    html=html.replace('</div>\n</header>',showcase+'</div>\n</header>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='<div><h1>Helix BioPharma</h1><p>The audit could not load from its archived source.</p><p><a href="./showcase.html">Open the Creative Showcase</a></p></div>';
  }
})();
</script>
</body>
</html>
