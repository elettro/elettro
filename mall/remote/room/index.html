<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remote Mobile Showroom · Elettro Mall</title>
<style>
:root{--ink:#eafff8;--g:#18c29c;--bg:#06201c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#gl.hover{cursor:pointer}
.top{position:fixed;top:12px;left:14px;right:14px;z-index:5;display:flex;justify-content:space-between;gap:10px;pointer-events:none;align-items:flex-start}
.top>*{pointer-events:auto}
.brand{font-weight:800;letter-spacing:3px;font-size:13px;text-shadow:0 2px 10px #000}
.brand small{display:block;font-weight:500;letter-spacing:1.4px;color:var(--g);font-size:10px;margin-top:3px}
.btn{background:#06201ccc;color:var(--ink);border:1px solid #ffffff30;border-radius:999px;padding:8px 15px;font:600 13px "Segoe UI",sans-serif;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px);display:inline-block}
.btn:hover{background:#ffffff22}
.btn.exit{background:#b3261e;border-color:#b3261e}
.btn.go{background:var(--g);border-color:var(--g);color:#032019;font-weight:800}
#chips{position:fixed;left:14px;top:58px;z-index:5;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #ffffff30;background:#06201cc8;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
.chip i{font-style:normal;opacity:.6;margin-left:5px}
.chip.on{background:var(--g);color:#032019;border-color:transparent}
#panel{position:fixed;right:14px;bottom:14px;width:min(360px,calc(100vw - 28px));z-index:6;background:#06201cea;border:1px solid #ffffff26;border-radius:16px;padding:14px;backdrop-filter:blur(10px);box-shadow:0 10px 40px #000a}
#panel .k{font-size:11px;letter-spacing:1.5px;color:var(--g);font-weight:700;text-transform:uppercase}
#panel h2{font-size:19px;margin:4px 0 6px;line-height:1.2}
#panel p{font-size:13px;color:#bfe3d8;line-height:1.45}
#panel .row{display:flex;gap:8px;margin-top:11px;align-items:center}
#panel .row a,#panel .row button{flex:1;text-align:center}
#qrbox{display:none;margin-top:11px;align-items:center;gap:12px;background:#fff;color:#06201c;border-radius:12px;padding:10px}
#qrbox.on{display:flex}
#qrbox canvas{width:104px;height:104px;flex:none}
#qrbox div{font-size:12.5px;font-weight:600;line-height:1.4}
#qrbox small{display:block;font-weight:500;color:#4d6a63;margin-top:4px;word-break:break-all;font-size:10.5px}
#nav{display:flex;gap:6px;margin-top:10px;justify-content:space-between;align-items:center;font-size:12px;color:#9cc5b9}
#nav button{background:#ffffff14;border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
#nav button:hover{background:#ffffff2e}
#tip{position:fixed;z-index:7;pointer-events:none;background:#06201cf2;border:1px solid var(--g);padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transform:translate(16px,16px);transition:opacity .12s;white-space:nowrap}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:4;background:#06201cbb;border:1px solid #ffffff22;border-radius:999px;padding:9px 18px;font-size:13px;color:#cfe9e1;backdrop-filter:blur(8px);transition:opacity .6s;text-align:center;max-width:calc(100% - 28px)}
#hint.off{opacity:0;pointer-events:none}
#load{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
#load h1{font-size:22px;letter-spacing:4px}
#load p{color:var(--g);margin-top:8px;letter-spacing:2px;font-size:12px}
#joy{position:fixed;left:22px;bottom:30px;width:110px;height:110px;border-radius:50%;border:2px solid #ffffff30;background:#06201c66;z-index:5;display:none;touch-action:none}
#joy b{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#ffffff55}
@media(pointer:coarse){#joy{display:block}#hint{display:none}}
@media(max-width:700px){#panel{bottom:150px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="top">
  <div class="brand">ELETTRO REMOTE · MOBILE SHOWROOM<small id="stats">YOUR PHONE IS THE CONTROLLER · NO APP, NO ACCOUNT</small></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn go" id="auto">▶ Auto-present</button><a class="btn" href="/remote/" target="_blank" rel="noopener">Open the live demo ↗</a><a class="btn exit" href="/mall/">← Mall street</a></div>
</div>
<div id="chips"></div>
<div id="panel">
  <div class="k" id="pk"></div><h2 id="pt"></h2><p id="pp"></p>
  <div class="row"><a class="btn go" id="pgo" href="#" target="_blank" rel="noopener">Try it live ↗</a><button class="btn" id="pqr">Scan with my phone</button></div>
  <div id="qrbox"><canvas id="qrc" width="208" height="208"></canvas><div>Point your phone camera here to open it.<small id="qrurl"></small></div></div>
  <div id="nav"><button id="prev">‹</button><span id="cnt"></span><button id="next">›</button></div>
</div>
<div id="tip"></div>
<div id="hint">Click a phone to put it on the big screen · ← → to browse · drag to look · W A S D to walk</div>
<div id="joy"><b></b></div>
<div id="load"><div><h1>REMOTE MOBILE</h1><p>CHARGING THE PHONES…</p></div></div>
<script type="module" src="room.js"></script>
</body>
</html>
