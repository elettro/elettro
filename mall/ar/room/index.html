<title>Elettro AR Control Room</title>
<style>
:root{--ink:#f4efe6;--amber:#7fe9ff;--cy:#22e6ff;--pk:#ff5fd2;--bg:#07080f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab}
canvas#gl.hover{cursor:pointer}
.top{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-weight:800;letter-spacing:3px;font-size:13px;text-shadow:0 2px 10px #000}
.brand small{display:block;font-weight:500;letter-spacing:1.5px;color:var(--amber);font-size:10px;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{background:#07080fcc;color:var(--ink);border:1px solid #ffffff30;border-radius:999px;padding:9px 16px;font:600 13px "Segoe UI",sans-serif;text-decoration:none;cursor:pointer;backdrop-filter:blur(8px)}
.btn:hover{background:#ffffff22}
.btn.pri{background:#1b6cff;border-color:#1b6cff}
.btn.exit{background:#b3261e;border-color:#b3261e}
.btn.go{background:var(--amber);border-color:var(--amber);color:#04202a;font-weight:800}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:4;background:#07080fbb;border:1px solid #ffffff22;border-radius:999px;padding:9px 18px;font-size:13px;color:#d8d3c8;backdrop-filter:blur(8px);transition:opacity .6s;text-align:center;max-width:calc(100% - 28px)}
#hint.off{opacity:0;pointer-events:none}
#tip{position:fixed;z-index:6;pointer-events:none;background:#07080fee;border:1px solid var(--amber);padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translate(14px,14px);transition:opacity .15s;white-space:nowrap}
#pad{position:fixed;right:16px;bottom:18px;z-index:5;display:none;flex-direction:column;gap:8px}
#pad .btn{width:52px;height:52px;padding:0;font-size:20px}
@media(pointer:coarse){#pad{display:flex}#hint{bottom:90px}}
#load{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .8s}
#load.off{opacity:0;pointer-events:none}
#load h1{font:800 30px "Segoe UI",sans-serif;letter-spacing:4px}
#load p{color:var(--amber);letter-spacing:3px;font-size:11px;margin-top:10px}
#live{position:fixed;left:14px;bottom:18px;z-index:5;font-size:11px;letter-spacing:1.5px;background:#07080fbb;border:1px solid #ffffff22;border-radius:999px;padding:6px 12px;display:flex;gap:7px;align-items:center}
#live i{width:8px;height:8px;border-radius:50%;background:#3dff8b;box-shadow:0 0 8px #3dff8b}
#live.off i{background:#ffb84d;box-shadow:0 0 8px #ffb84d}
#ov{position:fixed;inset:4vh 3.5vw;z-index:12;background:#090a12f6;border:1px solid #7fe9ff66;border-radius:18px;box-shadow:0 0 70px #7fe9ff30,0 30px 80px #000c;display:none;flex-direction:column;overflow:hidden}
#ov.on{display:flex;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#ov header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #ffffff1a;flex:none}
#ov header h2{font:800 20px "Segoe UI",sans-serif;letter-spacing:1px;flex:1}
#ov header small{color:var(--amber);font-size:11px;letter-spacing:1.5px}
#ov .body{flex:1;overflow:auto;padding:18px;touch-action:pan-y}
#ov footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #ffffff1a;flex:none;justify-content:space-between;align-items:center}
.k4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#ffffff0c;border:1px solid #ffffff18;border-radius:12px;padding:14px 16px}
.stat b{display:block;font:800 36px/1.1 "Segoe UI",sans-serif;color:var(--cy)}
.stat span{font-size:12px;letter-spacing:1.5px;color:#b8b4c6;text-transform:uppercase}
.big{font:800 clamp(26px,4.2vw,50px)/1.08 "Segoe UI",sans-serif;margin:6px 0 14px}
.big em{font-style:normal;color:var(--amber)}
.row{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;margin:7px 0;font-size:14px}
.row .bar{height:14px;background:#ffffff14;border-radius:99px;overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:99px}
.row .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;border-radius:99px;padding:2px 9px;background:#3dff8b22;color:#3dff8b;border:1px solid #3dff8b66}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.pl span{font-weight:700;font-size:14px;border-radius:99px;padding:7px 14px;border:1px solid #ffffff30;background:#ffffff0d}
.cta{display:inline-block;background:var(--amber);color:#04202a;font-weight:800;padding:12px 20px;border-radius:12px;text-decoration:none;margin:6px 8px 6px 0}
.cta.alt{background:#ffffff14;color:var(--ink);border:1px solid #ffffff30}
.cta:hover{filter:brightness(1.15)}
.note{color:#c4c0d2;font-size:15px;line-height:1.55;margin:10px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.steps div{background:#ffffff0c;border:1px solid #ffffff18;border-radius:14px;padding:18px}
.steps b{color:var(--cy);font-size:12px;letter-spacing:2px}
.steps h4{font-size:20px;margin:6px 0}
.steps p{color:#c4c0d2;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin:6px 0 18px}
.two .btnbig{border-radius:18px;padding:22px 20px;text-align:center;font:800 28px/1.1 "Segoe UI",sans-serif;display:flex;flex-direction:column;justify-content:center;gap:6px}
.two .btnbig small{font:600 14px "Segoe UI",sans-serif;opacity:.85}
.two .arrow{align-self:center;font-size:34px;color:var(--amber)}
.b1{background:linear-gradient(180deg,#22e6ff,#0f9bb8);color:#001a20}
.b2{background:linear-gradient(180deg,#3dff8b,#1aa655);color:#03200f}
@media(max-width:760px){.two{grid-template-columns:1fr}.two .arrow{transform:rotate(90deg);text-align:center}}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.dots div{background:#ffffff0c;border:1px solid #ffffff18;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:#b8b4c6}
.dots div b{display:block;color:var(--amber);font-size:26px}
.car{display:flex;flex-direction:column;gap:12px;height:100%}
.car .stage{flex:1;min-height:200px;display:block;background:#000;border-radius:12px;overflow:hidden;position:relative}
.car .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #ffffff40;background:#000a;color:#fff;font-size:22px;cursor:pointer}
.car .nav.l{left:10px}.car .nav.r{right:10px}
.car .strip{display:flex;gap:8px;overflow-x:auto;flex:none;padding-bottom:4px}
.car .strip img{height:64px;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.7}
.car .strip img.on{border-color:var(--amber);opacity:1}
.spark{width:100%;height:170px;display:block}
@media(max-width:640px){.row{grid-template-columns:100px 1fr 60px;font-size:12px}#ov{inset:2vh 2vw}.btn{padding:8px 12px}}

@media(max-width:760px),(max-aspect-ratio:1/1){
 .top{top:8px;left:8px;right:8px;align-items:flex-start}
 .brand{font-size:11px;letter-spacing:2px}.brand small{font-size:9px}
 .btns{gap:6px}.btn{padding:7px 11px;font-size:12px}
 .btns .pri{display:none}
 #hint{font-size:11px;padding:7px 12px;bottom:84px;border-radius:14px}
 #live{bottom:84px;font-size:10px;padding:4px 9px}
 #pad{bottom:14px;right:12px;flex-direction:row}#pad .btn{width:56px;height:56px}
 #ov{inset:auto 0 0 0;height:44vh;border-radius:18px 18px 0 0;border-left:0;border-right:0;border-bottom:0;box-shadow:0 -10px 40px #000c;transition:height .3s}
 #ov.full{height:92vh}
 #ov header{padding:9px 12px;gap:8px}#ov header h2{font-size:15px}#ov header small{display:none}
 #ov .body{padding:12px}
 #ov footer{padding:8px 10px}#ov footer .btn{padding:7px 10px;font-size:12px}
 .big{font-size:24px}.note{font-size:14px}.stat b{font-size:26px}
 .steps{grid-template-columns:1fr 1fr;gap:8px}.steps div{padding:12px}.steps h4{font-size:16px}.steps p{font-size:12px}
 .car .stage{min-height:240px}.car .strip img{height:48px}
}
#ovExp{display:none}
@media(max-width:760px),(max-aspect-ratio:1/1){#ovExp{display:inline-block}}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.gal figure{background:#ffffff0c;border:1px solid #ffffff18;border-radius:12px;overflow:hidden}
.gal img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.gal figcaption{padding:8px 10px;font-size:13px;color:#c4c0d2}
.gal figcaption b{display:block;color:#fff}
.mock{background:#10122a;border:1px solid #7fe9ff55;border-radius:14px;padding:16px;margin:10px 0}
.mock h5{font-size:18px;margin-bottom:6px}
.mock p{font-size:14px;color:#c4c0d2;line-height:1.5}
</style>

<script>

/* ============ THREE SETUP ============ */
const canvas=$("#gl");

renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x060812);scene.fog=new THREE.Fog(0x060812,26,60);

function ctex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}

/* ----- wood paneling texture ----- */
function woodTex(base,rep){const t=ctex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.strokeStyle="rgba("+(Math.random()<.5?"20,8,2":"255,190,120")+","+(.03+Math.random()*.08)+")";g.lineWidth=1+Math.random()*2;const x=Math.random()*w;g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+12,h*.3,x-12,h*.6,x+4,h);g.stroke()}});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);return t}

/* ----- room shell: wood-paneled wall, lattice ceiling, oculus ----- */
const shell=new THREE.Mesh(new THREE.CylinderGeometry(WALLR,WALLR,SHELLH,64,1,true),new THREE.MeshStandardMaterial({map:woodTex("#1a1c36",[16,3]),roughness:.55,metalness:.1,side:THREE.BackSide}));shell.position.y=SHELLH/2;scene.add(shell);
const latT=ctex(512,512,(g,w,h)=>{g.fillStyle="#08080e";g.fillRect(0,0,w,h);g.strokeStyle="#2a2433";g.lineWidth=3;for(let i=-w;i<w*2;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();g.beginPath();g.moveTo(i,h);g.lineTo(i+h,0);g.stroke()}});latT.wrapS=latT.wrapT=THREE.RepeatWrapping;latT.repeat.set(10,10);
const dome=new THREE.Mesh(new THREE.SphereGeometry(WALLR,64,24,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({map:latT,roughness:1,side:THREE.BackSide}));dome.scale.y=.3;dome.position.y=SHELLH;scene.add(dome);
(function(){const n=380,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*(WALLR-1.5),y=SHELLH+Math.sqrt(Math.max(0,1-(r/WALLR)**2))*WALLR*.3-.1;pos.set([Math.cos(a)*r,y,Math.sin(a)*r],i*3)}const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffc977,size:.16,fog:false})))})();
const glowT=ctex(256,256,(g,w,h)=>{const gr=g.createRadialGradient(w/2,h/2,10,w/2,h/2,w/2);gr.addColorStop(0,"#e8f8ff");gr.addColorStop(.55,"#6a8cff");gr.addColorStop(1,"#1a1060");g.fillStyle=gr;g.fillRect(0,0,w,h)});
const disc=new THREE.Mesh(new THREE.CircleGeometry(4.6,64),new THREE.MeshBasicMaterial({map:glowT,fog:false}));disc.rotation.x=Math.PI/2;disc.position.y=SHELLH+3.2;scene.add(disc);
[[7.4,0],[6.4,.55],[5.4,1.1]].forEach(([r,dy],i)=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.55,64,1,true),wood);c.position.y=SHELLH+3.5-dy-.1*i;scene.add(c);const ring=new THREE.Mesh(new THREE.TorusGeometry(r-.03,.05,8,96),new THREE.MeshBasicMaterial({color:0x22e6ff,fog:false}));ring.rotation.x=Math.PI/2;ring.position.y=SHELLH+3.25-dy-.1*i;scene.add(ring)});
const oc=new THREE.PointLight(0x8f7bff,1.6,40,1.3);oc.position.set(0,SHELLH+1,0);scene.add(oc);
const carpetT=ctex(512,512,(g,w,h)=>{const cols=["#0c1230","#16206a","#2a2b9a","#1fb6d8","#080b1c","#1c1450"];for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=cols[(x*7+y*13+((x^y)&3))%cols.length];g.fillRect(x*32,y*32,32,32);if((x+y)%3===0){g.fillStyle="rgba(120,230,255,.35)";g.fillRect(x*32+10,y*32+10,12,12)}}for(let i=0;i<9000;i++){g.fillStyle="rgba(0,0,0,"+Math.random()*.12+")";g.fillRect(Math.random()*w,Math.random()*h,2,2)}});
carpetT.wrapS=carpetT.wrapT=THREE.RepeatWrapping;carpetT.repeat.set(7,7);
const floor=new THREE.Mesh(new THREE.CircleGeometry(WALLR,64),new THREE.MeshStandardMaterial({map:carpetT,roughness:.9}));floor.rotation.x=-Math.PI/2;scene.add(floor);
[WALLR-.3,10.6].forEach(r=>{const m=new THREE.Mesh(new THREE.RingGeometry(r,r+.08,96),new THREE.MeshBasicMaterial({color:0x22e6ff}));m.rotation.x=-Math.PI/2;m.position.y=.03;scene.add(m)});
scene.add(new THREE.HemisphereLight(0xb8c8ff,0x14142a,.9));
[[-9,6,-4,.9,0x7a8cff],[9,6,-4,.9,0xc07aff],[0,5,6,.6,0x6aa8ff],[0,8,-9,.7,0x6cd6ff]].forEach(l=>{const p=new THREE.PointLight(l[4],l[3],30,1.4);p.position.set(l[0],l[1],l[2]);scene.add(p)});

/* ----- curved backdrop, wood soffit, glow strips, tickers ----- */
const ARC=(COLS*STEP)/2+.2, tS=Math.PI-ARC, tL=ARC*2;
const back=new THREE.Mesh(new THREE.CylinderGeometry(R+.35,R+.35,10,64,1,true,tS,tL),new THREE.MeshStandardMaterial({color:0x08090f,roughness:.5,metalness:.4,side:THREE.BackSide}));back.position.y=5;scene.add(back);
const soffit=new THREE.Mesh(new THREE.CylinderGeometry(R+.9,R+.9,1.6,64,1,true,tS-.06,tL+.12),woodDark);soffit.position.y=10.4;scene.add(soffit);
const soffitCap=new THREE.Mesh(new THREE.CylinderGeometry(R+.9,R+.9,.1,64,1,true,tS-.06,tL+.12),new THREE.MeshBasicMaterial({color:0x7a6bff,side:THREE.DoubleSide}));soffitCap.position.y=9.55;scene.add(soffitCap);
const baseWood=new THREE.Mesh(new THREE.CylinderGeometry(R+.9,R+.9,1.1,64,1,true,tS-.06,tL+.12),woodDark);baseWood.position.y=.55;scene.add(baseWood);
const baseGlow=new THREE.Mesh(new THREE.CylinderGeometry(R+.35,R+.35,.14,64,1,true,tS,tL),new THREE.MeshBasicMaterial({color:0x22e6ff,side:THREE.DoubleSide}));baseGlow.position.y=1.2;scene.add(baseGlow);
const tk=ctex(4096,128,()=>{});tk.wrapS=THREE.RepeatWrapping;tk.repeat.x=-1;
const tmat=new THREE.MeshBasicMaterial({map:tk,side:THREE.BackSide});
const tickerA=new THREE.Mesh(new THREE.CylinderGeometry(R+.25,R+.25,.5,96,1,true,tS,tL),tmat);tickerA.position.y=1.55;scene.add(tickerA);
const tickerB=new THREE.Mesh(new THREE.CylinderGeometry(R+.25,R+.25,.4,96,1,true,tS,tL),tmat);tickerB.position.y=9.3;scene.add(tickerB);
function paintTicker(){
  const items=["POINT. SCAN. IT PLAYS.","NO APP TO INSTALL","0 APPS · 5 EXPERIENCES · 1 QR CODE","AR.ELETTRO.COM","VIDEO · SHOP · LINK PAGE · GALLERY · 3D OBJECT","IF IT CAN BE PRINTED, IT CAN BE SCANNED","EVERY BRAND GETS ITS OWN AR","YOUR CAMERA PICTURE STAYS ON YOUR PHONE"];

/* ============ PANELS ============ */
function frame(g,w,h,title,accent,sub){

    g.fillStyle="#ff5fd2";g.font="800 92px 'Segoe UI',sans-serif";g.fillText("ar.elettro.com",w/2,1130);
    g.fillStyle="#9fe8ff";g.font="600 38px 'Segoe UI',sans-serif";g.fillText("Scan any of the covers on the wall too",w/2,1200)});
  onBack(0,7.45,5,6.25,tex);
})();
const LB={cv:document.createElement("canvas")};LB.cv.width=1024;LB.cv.height=640;LB.g=LB.cv.getContext("2d");

const BRANDC={elettro:"#22e6ff",solarmeister:"#ffc83d","neckermann-strom":"#ff5fd2",stashbox:"#8f7bff"};
function ago(t){const s=Math.max(0,(Date.now()-t)/1000);if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
function paintLB(d){
  const g=LB.g,w=1024,h=640;g.clearRect(0,0,w,h);g.fillStyle="#07090f";g.fillRect(0,0,w,h);

      g.fillStyle="#fff";g.font="800 26px 'Segoe UI',sans-serif";g.fillText("#"+(i+1),60,y+50);
      g.font="800 40px 'Segoe UI',sans-serif";let t=m.name||m.id;while(g.measureText(t).width>520&&t.length>6)t=t.slice(0,-2);if(t!==(m.name||m.id))t=t.trim()+"…";g.fillText(t,130,y+54);
      g.fillStyle=BRANDC[m.brand]||"#9fe8ff";g.font="700 26px 'Segoe UI',sans-serif";g.fillText(String(m.brand).toUpperCase()+"  ·  "+ago(Date.parse(m.last)),130,y+98);

      g.fillStyle="#9b97b4";g.font="700 22px 'Segoe UI',sans-serif";g.fillText("SCANS",w-100,y+112);g.textAlign="left"});
    g.fillStyle="#9fe8ff";g.font="700 28px 'Segoe UI',sans-serif";g.fillText("All time: "+d.total+" scans  ·  elettro.com/dash",36,610)}

onBack(-.5,4.3,5.2,3.25,LB.tex);paintLB(null);
const SCAN_API="https://77vr7dbzgn733xvyqcs32lllvu0tqoph.lambda-url.us-east-1.on.aws/ar/stats";
function pollScans(){fetch(SCAN_API,{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  const rows=(j.markers||[]).filter(m=>m.last).sort((a,b)=>Date.parse(b.last)-Date.parse(a.last)).slice(0,3);
  paintLB({rows,total:(j.total&&j.total.scans)||0})}).catch(()=>{})}
pollScans();setInterval(pollScans,30000);

/* ============ CAMERA / CONTROLS (museum pattern) ============ */
const START_Z=3.6;
const st={x:0,z:START_Z,y:EYE,yaw:0,pitch:.1,gx:0,gz:START_Z,gy:EYE,gyaw:0,gpitch:.1,autoPos:false,autoLook:false,focus:-1,bx:0,bz:START_Z};
const keys={};const maxR=5.0;
function clampPos(){const r=Math.hypot(st.x,st.z);if(r>maxR){st.x*=maxR/r;st.z*=maxR/r}}
function angDelta(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
const hint=$("#hint");const hideHint=()=>hint.classList.add("off");

let openIdx=-1,ovT=0;
function focusOn(i){setFov(FOV0);
  const p=PANELS[i];if(st.focus<0){st.bx=st.x;st.bz=st.z}
  st.focus=i;const port=innerWidth/innerHeight<1;const dist=p.big?(port?9:7.5):(port?6.6:3.9);
  st.gx=p.pos.x-Math.sin(p.th)*dist;st.gz=p.pos.z+Math.cos(p.th)*dist;st.gy=Math.max(port?2.4:1.9,p.pos.y-.6);
  st.gyaw=-p.th;const dh=Math.hypot(st.gx-p.pos.x,st.gz-p.pos.z);st.gpitch=Math.atan((p.pos.y-st.gy)/dh)-(port?.2:0);
  st.autoPos=true;st.autoLook=true;hideHint();
  openIdx=i;clearTimeout(ovT);ovT=setTimeout(()=>{if(openIdx===i)renderOverlay(i)},850);
}
function unfocus(){
  $("#ov").classList.remove("on","full");openIdx=-1;clearTimeout(ovT);
  if(st.focus>=0){st.focus=-1;st.gx=st.bx;st.gz=st.bz;st.gy=EYE;st.gpitch=.1;st.gyaw=0;st.autoPos=true;st.autoLook=true}
}
function renderOverlay(i,refresh){
  const p=PANELS[i];$("#ovT").textContent=p.t;$("#ovS").textContent=p.live?(D.live?"LIVE FROM ELETTRO OS":"SNAPSHOT"):(p.edu?"HOW ELETTRO OS WORKS":"");
  $("#ovN").textContent=(i+1)+" of "+PANELS.length;
  if(p.custom==="carousel"){$("#ov").classList.add("full");if(!refresh)buildCar();else showCar()}else{$("#ovB").innerHTML=p.html()}
  $("#ov").classList.add("on");
}
function buildCar(){
  $("#ovB").innerHTML=`<div class="car"><div class="stage"><button class="nav l" id="cL">‹</button><img id="cI" alt=""><button class="nav r" id="cR">›</button></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b id="cT" style="flex:1"></b><button class="btn" id="cA"></button><a class="btn pri" id="cO" target="_blank" rel="noopener">Open full size ↗</a></div><div class="strip" id="cS"></div></div>`;
  $("#cS").innerHTML=sheetsMeta().map((s,k)=>`<img src="img/${s.f}" data-k="${k}" alt="${esc(s.t)}" loading="lazy">`).join("");
  $("#cL").onclick=()=>{carAuto=false;stepCar(-1)};$("#cR").onclick=()=>{carAuto=false;stepCar(1)};
  $("#cA").onclick=()=>{carAuto=!carAuto;showCar()};
  $("#cS").onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k!=null){carAuto=false;carIdx=+k;paintPanel(PANELS[byId("sheets")]);showCar()}};
  showCar();
}
function stepCar(d){if(!CAR.length)return;carIdx=(carIdx+d+CAR.length)%CAR.length;paintPanel(PANELS[byId("sheets")]);showCar()}
function showCar(){const s=CAR[carIdx]&&CAR[carIdx].s;if(!s||!$("#cI"))return;$("#cI").src="img/"+s.f;$("#cT").textContent=s.t;$("#cO").href="img/"+s.f;$("#cA").textContent=carAuto?"⏸ Pause":"▶ Auto-play";
  document.querySelectorAll("#cS img").forEach(im=>{const on=+im.dataset.k===carIdx;im.classList.toggle("on",on);if(on&&carAuto)im.scrollIntoView({block:"nearest",inline:"center"})})}
$("#ovX").onclick=unfocus;$("#ovExp").onclick=()=>$("#ov").classList.toggle("full");
$("#ovP").onclick=()=>focusOn((openIdx-1+PANELS.length)%PANELS.length);
$("#ovNx").onclick=()=>focusOn((openIdx+1)%PANELS.length);
addEventListener("keydown",e=>{keys[e.code]=true;
  if(e.code==="Escape"){if(tour)stopTour();else unfocus()}
  if(openIdx>=0&&e.code==="ArrowRight"){focusOn((openIdx+1)%PANELS.length);e.preventDefault()}
  if(openIdx>=0&&e.code==="ArrowLeft"){focusOn((openIdx-1+PANELS.length)%PANELS.length);e.preventDefault()}
  if(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))hideHint()});
addEventListener("keyup",e=>{keys[e.code]=false});
let drag=null;const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const ptrs=new Map();let pinchD=0;
const FOV0=74;function setFov(f){camera.fov=Math.max(28,Math.min(96,f));camera.updateProjectionMatrix()}
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
canvas.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){drag=null;pinchD=pdist();if(tour)stopTour();hideHint();return}
  drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){const d=pdist();if(pinchD>0)setFov(camera.fov*(pinchD/d));pinchD=d;return}
  if(drag){const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;
    if(drag.moved){if(tour)stopTour();st.yaw+=dx*.0042;st.pitch=Math.max(-1.1,Math.min(1.3,st.pitch+dy*.0035));st.gyaw=st.yaw;st.gpitch=st.pitch;st.autoLook=false;hideHint()}}
  else hover(e)});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0}
canvas.addEventListener("pointerup",e=>{const was=ptrs.size;endPtr(e);if(was<2&&drag&&!drag.moved)click(e);drag=null});
canvas.addEventListener("pointercancel",e=>{endPtr(e);drag=null});
canvas.addEventListener("dblclick",()=>setFov(FOV0));
function pick(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(pickables.concat([floor]),false)[0]||null}
const tip=$("#tip");
function hover(e){const h=pick(e);const o=h&&h.object;
  if(o&&o.userData.link){canvas.classList.add("hover");tip.textContent="Open ar.elettro.com  ·  click";tip.style.opacity=1}
  else if(o&&o.userData.exit){canvas.classList.add("hover");tip.textContent="Exit to the Street";tip.style.opacity=1}
  else if(o&&o.userData.pid!==undefined){canvas.classList.add("hover");tip.textContent=PANELS[o.userData.pid].t+"  ·  click to open";tip.style.opacity=1}
  else{canvas.classList.remove("hover");tip.style.opacity=0;return}
  tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"}
function clampTarget(){const r=Math.hypot(st.gx,st.gz);if(r>maxR){st.gx*=maxR/r;st.gz*=maxR/r}}
function click(e){const h=pick(e);if(!h)return;hideHint();if(tour)stopTour();
  if(h.object.userData.link){window.open(h.object.userData.link,"_blank","noopener");return}
  if(h.object.userData.exit){location.href="../../index.html";return}
  if(h.object.userData.pid!==undefined){focusOn(h.object.userData.pid);return}
  if(h.object===floor){if(st.focus>=0)unfocus();st.gx=h.point.x;st.gz=h.point.z;st.gy=EYE;clampTarget();st.autoPos=true;const ty=Math.atan2(-(h.point.x-st.x),-(h.point.z-st.z));st.gyaw=st.yaw+angDelta(st.yaw,ty);st.autoLook=true;st.gpitch=.1}}
canvas.addEventListener("wheel",e=>{e.preventDefault();hideHint();if(e.ctrlKey){setFov(camera.fov*Math.exp(e.deltaY*.01));return}if(tour)stopTour();let dy=e.deltaY;if(e.deltaMode===1)dy*=30;const amt=Math.max(-2.5,Math.min(2.5,-dy*.012));
  if(st.focus>=0)unfocus();st.autoPos=false;st.autoLook=false;st.x+=-Math.sin(st.yaw)*amt;st.z+=-Math.cos(st.yaw)*amt;clampPos();st.gx=st.x;st.gz=st.z},{passive:false});
let padDir=0;[["padF",1],["padB",-1]].forEach(([id,d])=>{const b=$("#"+id);b.addEventListener("pointerdown",e=>{padDir=d;hideHint();if(tour)stopTour();e.stopPropagation()});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{padDir=0}))});

/* guided tours: "How it works" (education) and "Wall tour" (everything) */
let tour=false,tourT=0,tourI=0,tourOrder=[];
function startTour(ids,btnEl){tour=true;tourOrder=ids.map(byId);tourI=0;tourT=0;unfocus();hideHint();btnEl.textContent="■ Stop tour"}
function stopTour(){tour=false;$("#tourBtn").textContent="▶ Wall tour";$("#learnBtn").textContent="★ How it works";unfocus()}
$("#learnBtn").onclick=()=>{if(tour){stopTour();return}startTour(["hero","steps","video","link","shop","gallery","obj3d","solar","brandscan","neck","os","where","try"],$("#learnBtn"))};
$("#scanBtn").onclick=()=>{if(tour)stopTour();unfocus();hideHint();setFov(FOV0);st.gx=0;st.gz=4;st.autoPos=true;st.gyaw=st.yaw+angDelta(st.yaw,Math.PI);st.gpitch=.18;st.autoLook=true};
$("#tourBtn").onclick=()=>{if(tour){stopTour();return}startTour(["stats","covers","hero","sheets","solar","calc","neck","scratch","contact","os","qrs","where","noapp","try","cta"],$("#tourBtn"))};

let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(tour){tourT-=dt;if(tourT<=0){tourT=8;if(tourI>=tourOrder.length){stopTour()}else{focusOn(tourOrder[tourI]);tourI++}}}
  let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyD)s++;if(keys.KeyA)s--;f+=padDir;
  if(openIdx<0){if(keys.ArrowLeft)st.yaw+=1.7*dt,st.gyaw=st.yaw;if(keys.ArrowRight)st.yaw-=1.7*dt,st.gyaw=st.yaw}
  if(f||s){if(tour)stopTour();st.autoPos=false;st.autoLook=false;if(st.focus>=0||openIdx>=0)unfocus();
    const sp=(keys.ShiftLeft?6:3.4)*dt;st.x+=(-Math.sin(st.yaw)*f+Math.cos(st.yaw)*s)*sp;st.z+=(-Math.cos(st.yaw)*f-Math.sin(st.yaw)*s)*sp;clampPos();st.gx=st.x;st.gz=st.z}
  const k=1-Math.exp(-dt*3.6);
  if(st.autoPos){st.x+=(st.gx-st.x)*k;st.z+=(st.gz-st.z)*k;if(Math.hypot(st.gx-st.x,st.gz-st.z)<.02)st.autoPos=false}
  st.y+=(st.gy-st.y)*k;
  if(st.autoLook){st.yaw+=angDelta(st.yaw,st.gyaw)*k;st.pitch+=(st.gpitch-st.pitch)*k;if(Math.abs(angDelta(st.yaw,st.gyaw))<.003&&Math.abs(st.gpitch-st.pitch)<.003)st.autoLook=false}
  const bob=(f||s)?Math.sin(now/170)*.03:0;camera.position.set(st.x,st.y+bob,st.z);camera.rotation.set(st.pitch,st.yaw,0);
  tk.offset.x=-(now/1000*.012)%1;HOLO.forEach((h,i)=>{h.rotation.y=now/1500*(i?-1:1);h.position.y=2.3+Math.sin(now/700+i)*.08});
  renderer.render(scene,camera);requestAnimationFrame(loop)}
repaintAll();
setTimeout(()=>paintPanel(PANELS[byId("sheets")]),1500);
const hash=location.hash.slice(1);const hi=byId(hash);if(hi>=0)setTimeout(()=>focusOn(hi),900);
if(hash==="tour")setTimeout(()=>$("#learnBtn").click(),900);
requestAnimationFrame(t=>{lastT=t;loop(t)});
setTimeout(()=>$("#load").classList.add("off"),700);
window.__room={st,PANELS,focusOn,camera,renderer,scene};
})();
